<svg width="880" height="600" viewBox="0 0 880 600" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="0.5" stop-color="#fde047"/>
      <stop offset="1" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Window -->
  <rect width="880" height="600" rx="10" fill="#fefce8"/>

  <!-- Header: logo, title, view switcher, gear -->
  <line x1="0" y1="50" x2="880" y2="50" stroke="#fde68a"/>
  <rect x="16" y="12" width="26" height="26" rx="7" fill="url(#logo)"/>
  <rect x="22" y="19" width="14" height="15" rx="1.5" fill="#ffffff" fill-opacity="0.96"/>
  <circle cx="25.5" cy="19.5" r="0.8" fill="#ca8a04"/>
  <circle cx="29" cy="19.5" r="0.8" fill="#ca8a04"/>
  <circle cx="32.5" cy="19.5" r="0.8" fill="#ca8a04"/>
  <rect x="24.5" y="23" width="9" height="1" rx="0.5" fill="#ca8a04" fill-opacity="0.4"/>
  <rect x="24.5" y="26" width="7" height="1" rx="0.5" fill="#ca8a04" fill-opacity="0.3"/>
  <rect x="24.5" y="29" width="8" height="1" rx="0.5" fill="#ca8a04" fill-opacity="0.3"/>
  <text x="52" y="31" fill="#1c1917" font-size="16" font-weight="600">Clipboard-Saver</text>

  <rect x="186" y="13" width="62" height="24" rx="12" fill="#ca8a04"/>
  <text x="217" y="29" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">Home</text>
  <rect x="254" y="13" width="58" height="24" rx="12" fill="none" stroke="#fde68a"/>
  <text x="283" y="29" fill="#78716c" font-size="12" text-anchor="middle">Work</text>
  <rect x="318" y="13" width="68" height="24" rx="12" fill="none" stroke="#fde68a"/>
  <text x="352" y="29" fill="#78716c" font-size="12" text-anchor="middle">Support</text>

  <path d="M840 17c4.5 0 8 3.6 8 8s-3.5 8-8 8-8-3.6-8-8 3.5-8 8-8Z" fill="none" stroke="#78716c" stroke-width="2"/>
  <circle cx="840" cy="25" r="3" fill="#78716c"/>

  <!-- Grid 5x4, free placement, per-snippet colors, auto-fit text -->
  <g font-weight="600" text-anchor="middle">
    <!-- row 1 -->
    <rect x="18" y="64" width="162" height="100" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="99" y="112" fill="#1c1917" font-size="17">Email</text>
    <text x="99" y="134" fill="#1c1917" font-size="17">Signature</text>
    <rect x="190" y="64" width="162" height="100" rx="10" fill="#ffffff" stroke="#fde68a"/>
    <text x="271" y="112" fill="#1c1917" font-size="17">Home</text>
    <text x="271" y="134" fill="#1c1917" font-size="17">Address</text>
    <rect x="362" y="64" width="162" height="100" rx="10" fill="#fee2e2" stroke="#fde68a"/>
    <text x="443" y="120" fill="#1c1917" font-size="19">IBAN</text>
    <rect x="534" y="64" width="162" height="100" rx="10" fill="#ffffff" stroke="#fde68a"/>
    <text x="615" y="112" fill="#1c1917" font-size="17">Meeting</text>
    <text x="615" y="134" fill="#1c1917" font-size="17">Link</text>
    <rect x="706" y="64" width="162" height="100" rx="10" fill="#dcfce7" stroke="#fde68a"/>
    <text x="787" y="112" fill="#1c1917" font-size="17">Support</text>
    <text x="787" y="134" fill="#1c1917" font-size="17">Reply</text>
    <!-- row 2 -->
    <rect x="18" y="172" width="162" height="100" rx="10" fill="#ffffff" stroke="#fde68a"/>
    <text x="99" y="220" fill="#1c1917" font-size="17">Phone</text>
    <text x="99" y="242" fill="#1c1917" font-size="17">Number</text>
    <rect x="190" y="172" width="162" height="100" rx="10" fill="#ede9fe" stroke="#fde68a"/>
    <text x="271" y="220" fill="#1c1917" font-size="17">Order</text>
    <text x="271" y="242" fill="#1c1917" font-size="17">Status</text>
    <rect x="362" y="172" width="162" height="100" rx="10" fill="#16a34a"/>
    <text x="443" y="222" fill="#ffffff" font-size="18">Wi-Fi Code</text>
    <rect x="395" y="244" width="96" height="20" rx="10" fill="#ca8a04"/>
    <text x="443" y="258" fill="#fff" font-size="11">Copied!</text>
    <rect x="534" y="172" width="162" height="100" rx="10" fill="#ffffff" stroke="#fde68a"/>
    <text x="615" y="220" fill="#1c1917" font-size="17">Invoice</text>
    <text x="615" y="242" fill="#1c1917" font-size="17">Note</text>
    <!-- row 3 -->
    <rect x="18" y="280" width="162" height="100" rx="10" fill="#fef9c3" stroke="#fde68a"/>
    <text x="99" y="336" fill="#1c1917" font-size="19">Follow-up</text>
    <rect x="190" y="280" width="162" height="100" rx="10" fill="#ffffff" stroke="#fde68a"/>
    <text x="271" y="328" fill="#1c1917" font-size="17">Greeting</text>
    <text x="271" y="350" fill="#1c1917" font-size="17">DE</text>
  </g>

  <!-- Composer -->
  <line x1="0" y1="534" x2="880" y2="534" stroke="#fde68a"/>
  <rect x="16" y="546" width="744" height="40" rx="10" fill="#ffffff" stroke="#fde68a"/>
  <text x="30" y="571" fill="#78716c" font-size="13">Type a snippet…</text>
  <rect x="772" y="546" width="92" height="40" rx="10" fill="#ca8a04"/>
  <text x="818" y="571" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">Save</text>

  <!-- Floating pill (always on top, over any app) -->
  <g filter="url(#shadow)">
    <rect x="650" y="420" width="170" height="48" rx="24" fill="#ca8a04"/>
    <text x="735" y="450" fill="#fff" font-size="15" font-weight="600" text-anchor="middle">Email Signature</text>
  </g>
  <text x="735" y="492" fill="#78716c" font-size="11" text-anchor="middle">floating quick-copy button</text>
</svg>
