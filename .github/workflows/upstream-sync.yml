name: Sync from upstream

on:
  schedule:
    - cron: '0 6 * * 1'  # every Monday 06:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream (Prompt-Saver)
        run: |
          git remote add upstream https://github.com/wbgcoding/Prompt-Saver.git
          git fetch upstream

      - name: Merge upstream changes
        # On conflict our branding values win (-X ours keeps productName, identifier, theme).
        # -X ours only settles clashing hunks inside a file, though: when upstream deletes
        # something we still edit, git stops with a modify/delete conflict it cannot decide.
        # Keep our side there too - README.md embeds docs/screenshot.svg, which upstream
        # dropped - and let a deletion of ours stand when it is the other way round.
        run: |
          git merge upstream/master --no-edit -X ours && exit 0
          git diff --name-only --diff-filter=U -z > "$RUNNER_TEMP/unmerged"
          [ -s "$RUNNER_TEMP/unmerged" ] || exit 1
          while IFS= read -r -d '' f; do
            if git rev-parse --verify -q ":2:$f" >/dev/null; then
              echo "keeping our $f"
              git add -- "$f"
            else
              echo "accepting our deletion of $f"
              git rm -q -- "$f"
            fi
          done < "$RUNNER_TEMP/unmerged"
          git commit --no-edit

      - name: Push
        run: git push origin master
